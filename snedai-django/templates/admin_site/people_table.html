{% load snedai %}{% if not rows %}
  <p class="empty">Personne pour le moment.</p>
{% else %}
<div class="table-wrap">
  <table>
    <thead><tr><th>#</th><th>Nom</th><th>Prénom</th><th>Adresse e-mail</th><th>Filiale</th><th>{{ date_label }}</th></tr></thead>
    <tbody>
      {% for r in rows %}
        <tr><td>{{ forloop.counter }}</td><td>{{ r.nom }}</td><td>{{ r.prenom }}</td><td>{{ r.email }}</td><td>{{ r.filiale }}</td><td>{{ r.date|ts }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endif %}
