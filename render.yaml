services:
  - type: web
    name: chezmaty-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Chez Maty
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./chezmaty.db
      - key: CORS_ORIGINS
        value: https://chezmaty.ci,https://www.chezmaty.ci
      - key: FRONTEND_URL
        value: https://chezmaty.ci
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
