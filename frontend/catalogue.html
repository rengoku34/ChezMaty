<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7651a6">
  <meta name="description" content="Parcourez les cadeaux personnalisés Chez Maty pour bébé et enfant : coffrets, tétines, gâteaux de couches et jolies attentions.">
  <link rel="canonical" href="https://chezmaty.netlify.app/catalogue.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Chez Maty">
  <meta property="og:title" content="Cadeaux personnalisés pour bébé — Boutique Chez Maty">
  <meta property="og:description" content="Découvrez nos coffrets de naissance, tétines personnalisées, gâteaux de couches et cadeaux pour bébé à Abidjan.">
  <meta property="og:url" content="https://chezmaty.netlify.app/catalogue.html">
  <title>La boutique — Chez Maty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
  <script src="js/catalogue.js" defer></script>
</head>
<body data-page="catalogue">

  <header class="site-header" id="site-header"></header>
  <main class="section-wrap page-main">
    <nav class="breadcrumbs" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a><span aria-hidden="true">/</span><span aria-current="page">La boutique</span></nav>
    <section class="catalogue-intro">
      <div><span class="eyebrow">De doux cadeaux à offrir</span><h1>La boutique <span aria-hidden="true">♡</span></h1><p>Chaque création raconte une jolie histoire. Trouvez la vôtre.</p></div>
      <img src="images/tetine.svg" alt="" aria-hidden="true">
    </section>
    <form class="filter-panel" id="catalogue-filters" role="search">
      <label class="search-field"><span class="sr-only">Rechercher un cadeau</span><span aria-hidden="true">⌕</span><input id="filter-search" name="q" type="search" placeholder="Un prénom, un cadeau..." maxlength="100"></label>
      <label><span class="sr-only">Catégorie</span><select id="filter-category" name="category"><option value="">Toutes les catégories</option></select></label>
      <label><span class="sr-only">Prix minimum en FCFA</span><input id="filter-min-price" name="min_price" type="number" min="0" placeholder="Prix min"></label>
      <label><span class="sr-only">Prix maximum en FCFA</span><input id="filter-max-price" name="max_price" type="number" min="0" placeholder="Prix max"></label>
      <label><span class="sr-only">Âge conseillé</span><select id="filter-age" name="age"><option value="">Tous les âges</option><option value="0-12">0 à 12 mois</option><option value="1-3">1 à 3 ans</option><option value="3+">3 ans et plus</option></select></label>
      <label><span class="sr-only">Couleur</span><select id="filter-color" name="color"><option value="">Toutes les couleurs</option><option value="Rose">Rose</option><option value="Violet">Violet</option><option value="Bleu">Bleu</option><option value="Beige">Beige</option><option value="Blanc">Blanc</option></select></label>
      <label><span class="sr-only">Trier les produits</span><select id="filter-sort" name="sort"><option value="newest">Les nouveautés</option><option value="price_asc">Prix croissant</option><option value="price_desc">Prix décroissant</option></select></label>
      <button class="button button-primary filter-submit" type="submit">Rechercher</button>
      <button class="button button-quiet filter-reset" id="reset-filters" type="reset">Effacer</button>
    </form>
    <div class="catalogue-results-heading"><p id="results-count" role="status" aria-live="polite">Chargement des jolies créations…</p></div>
    <div class="product-grid catalogue-grid" id="catalogue-products" aria-live="polite">
      <div class="product-skeleton skeleton"></div><div class="product-skeleton skeleton"></div><div class="product-skeleton skeleton"></div><div class="product-skeleton skeleton"></div>
    </div>
    <div class="empty-state" id="catalogue-empty" hidden><span aria-hidden="true">♡</span><h2>Aucun trésor trouvé</h2><p>Essayez d'autres mots ou retirez quelques filtres.</p><button class="button button-primary" id="empty-reset" type="button">Voir toute la boutique</button></div>
    <p class="api-message" id="catalogue-error" role="alert" hidden></p>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
