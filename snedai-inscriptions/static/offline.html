<!doctype html>
<html lang="fr">
<head>

    a.btn { display: inline-block; margin-top: .5rem; padding: .55rem 1rem; border-radius: 6px; background: #f08a46; color: #fff; font-weight: 600; text-decoration: none; }

<body>
  <div class="box">
    <h1>Pas de connexion Internet</h1>
