<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: sans-serif; background: #eef0f5; color: #26246a; text-align: center; padding: 14vh 1.2rem 1rem; }
  .logo { background: #fff; display: inline-block; padding: .7rem 1.2rem; border-radius: 10px; }
  .logo img { height: 64px; display: block; }
  p { margin: 2rem 0 1.2rem; font-size: 1.15rem; }
  .rond { width: 38px; height: 38px; margin: 0 auto; border: 4px solid #dcdde6; border-top-color: #f08a46; border-radius: 50%; animation: tourner 0.9s linear infinite; }
  @keyframes tourner { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <span class="logo"><img src="logo.png" alt="SNEDAI"></span>
  <p>Recherche du serveur…</p>
  <div class="rond"></div>
</body>
</html>
