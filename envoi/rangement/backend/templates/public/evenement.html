{% extends 'base.html' %}
{# PUBLIC : la page d'accueil du lien. L'employé voit le thème et le lieu, puis clique sur « Démarrer » pour accéder au formulaire. #}
{% block nav %}{% endblock %}
{% block content %}
<div class="invit-banniere" aria-hidden="true">
  <svg viewBox="0 0 600 90" preserveAspectRatio="none">
    <path d="M0 50 C100 10 200 90 320 45 S520 5 600 40 V90 H0 Z" fill="#ffffff" fill-opacity=".18"/>
    <path d="M0 65 C120 30 220 95 340 62 S520 30 600 60 V90 H0 Z" fill="#ffffff" fill-opacity=".35"/>
    <path d="M0 78 C130 55 240 98 360 78 S530 58 600 76 V90 H0 Z" fill="#ffffff"/>
  </svg>
</div>
<section class="invit-carte">
  <h1 class="invit-titre">{{ evenement.nom }}</h1>
  <p class="invit-lieu">Lieu : {{ evenement.lieu }}</p>
  <a class="btn" href="{% url 'evenement-formulaire' evenement.lien %}">Démarrer</a>
</section>
{% endblock %}
